[package]
name = "image-viewer-for-artist"
version = "0.1.0"
description = "A focused reference viewer for artists"
authors = ["Line & Light"]
edition = "2021"

[lib]
name = "image_viewer_for_artist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
